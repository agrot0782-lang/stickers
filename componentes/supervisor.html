<div class="row mt-4">

    <div class="col-md-4">

        <div class="card panel">

            <div class="card-body">

                <h4>

                    Supervisor

                </h4>

                <select
                id="supervisor"
                class="form-select mt-3">

                    <option value="">

                        Seleccione supervisor

                    </option>

                </select>

                <button
                id="btnCargar"
                class="btn btn-success btn-terraflux mt-3 w-100">

                    👥 CARGAR CUADRILLA

                </button>

            </div>

        </div>

    </div>


    <div class="col-md-4">

        <div class="card panel">

            <div class="card-body">

                <h4>

                    Buscar trabajador

                </h4>

                <input
                type="text"
                id="buscar"
                class="form-control mt-3"
                placeholder="Nombre, legajo, grupo, actividad...">

                <small>

                    Búsqueda inteligente

                </small>

            </div>

        </div>

    </div>


    <div class="col-md-4">

        <div class="card panel">

            <div class="card-body">

                <h4>

                    Filtrar acceso

                </h4>

                <div class="mt-3">

                    <button
                    class="btn btn-outline-success">

                        Todos

                    </button>

                    <button
                    class="btn btn-outline-primary">

                        🟢 Con acceso

                    </button>

                    <button
                    class="btn btn-outline-danger">

                        🔴 Sin acceso

                    </button>

                </div>

            </div>

        </div>

    </div>

</div>
