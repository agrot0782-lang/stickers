<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reimpresiones Terraflux</title>

<style>
body{
    font-family: Arial;
    max-width: 800px;
    margin:40px auto;
    padding:20px;
}

textarea{
    width:100%;
    height:300px;
    font-size:18px;
}

button{
    width:100%;
    padding:15px;
    font-size:20px;
    cursor:pointer;
}
</style>
</head>

<body>

<h2>Reimpresión de Stickers</h2>

<p>Pega un legajo por línea</p>

<textarea id="legajos"></textarea>

<br><br>

<button onclick="imprimir()">
Enviar a impresión
</button>

<script>

async function imprimir(){

    const legajos =
        document
        .getElementById("legajos")
        .value
        .split("\n")
        .map(x => x.trim())
        .filter(x => x !== "");

    if(legajos.length === 0){
        alert("No hay legajos");
        return;
    }

    const r = await fetch(
        "http://192.168.6.91:5000/imprimir",
        {
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                legajos
            })
        }
    );

   const data = await r.json();

console.log(data);

alert(JSON.stringify(data));

}

</script>

</body>
</html>
